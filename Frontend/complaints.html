<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complaints Management</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f3f6fb;
        font-family: Arial, sans-serif;
        color: #1f2937;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        background: #fff;
        padding: 18px 20px;
        border-radius: 14px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
        margin-bottom: 20px;
      }
      nav a {
        text-decoration: none;
        color: #1d4ed8;
        background: #eff6ff;
        padding: 10px 16px;
        border-radius: 10px;
        font-weight: 700;
      }
      nav a[aria-current="page"] { background: #dbeafe; }
      .panel {
        background: #fff;
        padding: 24px;
        border-radius: 14px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
        margin-bottom: 20px;
      }
      h1, h2 { margin-top: 0; }
      form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }
      label {
        display: grid;
        gap: 8px;
        font-weight: 700;
      }
      input, select, textarea, button {
        font: inherit;
      }
      input, select, textarea {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
      }
      textarea { min-height: 120px; }
      button {
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        cursor: pointer;
        font-weight: 700;
      }
      button.secondary { background: #e2e8f0; color: #0f172a; }
      button.danger { background: #dc2626; }
      .receipt-box {
        display: none;
        margin-top: 20px;
        padding: 20px;
        border: 1px solid #dbe3ef;
        border-radius: 12px;
        background: #fff;
      }
      .receipt-box.printable {
        display: block;
      }
      .receipt-box h3 {
        margin-top: 0;
      }
      .receipt-meta {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
        margin: 16px 0;
      }
      .receipt-meta div {
        border-bottom: 1px solid #e2e8f0;
        padding-bottom: 8px;
      }
      .status-pill {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.75rem;
      }
      .status-pill.submitted { background: #e0f2fe; color: #075985; }
      .status-pill.under-review { background: #fef3c7; color: #92400e; }
      .status-pill.validated { background: #dcfce7; color: #166534; }
      .status-pill.resolved { background: #dbeafe; color: #1d4ed8; }
      .status-pill.rejected { background: #fee2e2; color: #991b1b; }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th, td {
        padding: 12px 10px;
        border-bottom: 1px solid #e2e8f0;
      }
      th { background: #f8fafc; color: #334155; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      #message {
        min-height: 24px;
        margin-top: 12px;
        font-weight: 700;
      }
      #message.error { color: #b91c1c; }
      #message.success { color: #15803d; }
      .table-scroll {
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        scrollbar-width: thin;
      }
      @media print {
        body { background: #fff; }
        nav, button, #message, .no-print { display: none !important; }
        .container { max-width: none; padding: 0; }
        .panel { box-shadow: none; border: none; }
        .receipt-box { display: block; border: 1px solid #000; }
      }
      @media (max-width: 640px) {
        .container { padding: 16px; }
      }
    </style>
    <link rel="stylesheet" href="/responsive.css" />
  </head>
  <body data-module="complaints">
    <div class="container">
      <nav>
        <a href="/">Dashboard</a>
        <a href="/showResidents.html">Residents</a>
        <a href="/documentRequests.html">Document Requests</a>
        <a href="/complaints.html" aria-current="page">Complaints</a>
        <a href="/officials.html">Officials</a>
        <a href="/announcements.html">Announcements</a>
        <button type="button" id="logout-button">Log out</button>
      </nav>

      <div class="panel">
        <h1>Complaint Submission</h1>
        <form id="complaint-form">
          <label>
            Resident (optional)
            <select name="resident_id">
              <option value="">Not a resident</option>
            </select>
          </label>
          <label>
            Complainant Name
            <input type="text" name="complainant_name" required />
          </label>
          <label>
            Contact Number
            <input type="tel" name="complainant_contact" maxlength="20" />
          </label>
          <label>
            Complaint Type
            <select name="complaint_type" required>
              <option value="">Select type</option>
              <option value="Noise">Noise</option>
              <option value="Public Safety">Public Safety</option>
              <option value="Infrastructure">Infrastructure</option>
              <option value="Sanitation">Sanitation</option>
              <option value="Other">Other</option>
            </select>
          </label>
          <label>
            Priority
            <select name="priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
              <option value="Urgent">Urgent</option>
            </select>
          </label>
          <label>
            Subject
            <input type="text" name="subject" required />
          </label>
          <div style="grid-column:1/-1;">
            <label>
              Details
              <textarea name="description" required></textarea>
            </label>
          </div>
          <div style="display:flex; align-items:end;">
            <button type="submit">Submit Complaint</button>
          </div>
        </form>
        <div id="message" aria-live="polite"></div>
      </div>

      <div class="panel">
        <h2>Complaints Queue</h2>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Complainant</th>
                <th>Type</th>
                <th>Subject</th>
                <th>Status</th>
                <th>Priority</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="complaints-body"></tbody>
          </table>
        </div>
      </div>

      <div class="receipt-box" id="complaint-receipt" aria-live="polite">
        <div class="no-print" style="display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:16px;">
          <h3>Complaint Receipt</h3>
          <button type="button" class="secondary" id="print-receipt">Print Receipt</button>
        </div>
        <div id="receipt-content"></div>
      </div>
    </div>

    <script src="/auth.js" defer></script>
    <script src="/management.js" defer></script>
    <script>
      const residentSelect = document.querySelector('select[name="resident_id"]');
      async function loadComplaintResidents() {
        try {
          const response = await fetch('/resident?page=1&limit=100');
          const result = await response.json();
          if (!response.ok) throw new Error(result.message || 'Unable to load residents');
          const residents = result.data || [];
          residentSelect.innerHTML = '<option value="">Not a resident</option>';
          residents.forEach((resident) => {
            const option = document.createElement('option');
            option.value = resident.id;
            option.textContent = `${resident.full_name} (${resident.resident_id || resident.id})`;
            residentSelect.appendChild(option);
          });
        } catch (error) {
          console.error(error);
        }
      }

      document.getElementById('complaint-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const payload = Object.fromEntries(new FormData(form).entries());
        const submitButton = form.querySelector('button[type="submit"]');
        const response = await fetch('/complaint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const result = await response.json();
        if (!response.ok) {
          const message = document.getElementById('message');
          message.textContent = result.message || 'Unable to submit complaint.';
          message.className = 'error';
          return;
        }
        form.reset();
        document.getElementById('message').className = 'success';
        document.getElementById('message').textContent = 'Complaint submitted successfully.';

        const receipt = document.getElementById('complaint-receipt');
        receipt.classList.add('printable');
        const content = document.getElementById('receipt-content');
        content.innerHTML = `
          <p><strong>Complaint ID:</strong> ${result.complaint_id || result.id}</p>
          <p><strong>Complainant:</strong> ${result.complainant_name}</p>
          <p><strong>Contact:</strong> ${result.complainant_contact || 'Not provided'}</p>
          <p><strong>Type:</strong> ${result.complaint_type}</p>
          <p><strong>Subject:</strong> ${result.subject}</p>
          <p><strong>Status:</strong> <span class="status-pill ${String(result.status).toLowerCase().replace(/\s+/g, '-')}">${result.status}</span></p>
          <p><strong>Priority:</strong> ${result.priority}</p>
          <p><strong>Submitted:</strong> ${new Date(result.created_at).toLocaleString()}</p>
          <div><strong>Details:</strong><br>${(result.description || '').replace(/\n/g, '<br>')}</div>
        `;
        submitButton.disabled = false;
        if (window.managementRecords) window.managementRecords = null;
        loadComplaintResidents();
      });

      document.getElementById('print-receipt').addEventListener('click', () => window.print());
      loadComplaintResidents();
    </script>
  </body>
</html>
