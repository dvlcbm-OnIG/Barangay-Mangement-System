<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barangay Staff Login</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef6ff, #f8fafc);
        font-family: Arial, sans-serif;
      }
      .card {
        width: min(100%, 440px);
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
        padding: 30px;
      }
      h1 {
        margin-top: 0;
        margin-bottom: 10px;
        text-align: center;
      }
      p {
        margin-top: 0;
        text-align: center;
        color: #64748b;
      }
      form {
        display: grid;
        gap: 16px;
      }
      label {
        display: grid;
        gap: 8px;
        font-weight: 700;
      }
      input, button {
        font: inherit;
      }
      input {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
      }
      button {
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        cursor: pointer;
        font-weight: 700;
      }
      .demo-credentials {
        margin-top: 16px;
        padding: 14px 16px;
        border: 1px solid #bfdbfe;
        border-radius: 12px;
        background: #eff6ff;
        color: #334155;
        font-size: 0.9rem;
      }
      .demo-credentials h2 {
        margin: 0 0 8px;
        color: #1e40af;
        font-size: 0.95rem;
      }
      .demo-credentials p {
        margin: 4px 0 0;
        color: #475569;
        text-align: left;
      }
      .demo-credentials strong {
        color: #1e3a8a;
      }
      #message {
        min-height: 24px;
        margin-top: 12px;
        font-weight: 700;
      }
      #message.error { color: #b91c1c; }
      #message.success { color: #15803d; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Barangay Staff Login</h1>
      <p>Access the barangay management system</p>
      <form id="login-form">
        <label>
          Username
          <input type="text" id="username" name="username" autocomplete="username" required />
        </label>
        <label>
          Password
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Login</button>
        <aside class="demo-credentials" aria-label="Demo login credentials">
          <h2>Demo credentials</h2>
          <p><strong>Username:</strong> admin1</p>
          <p><strong>Password:</strong> admin123</p>
        </aside>
      </form>
      <div id="message" aria-live="polite"></div>
    </div>

    <script>
      const form = document.getElementById('login-form');
      const message = document.getElementById('message');

      function setMessage(text, type = 'success') {
        message.textContent = text;
        message.className = type;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const submitButton = form.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        const payload = Object.fromEntries(new FormData(form).entries());

        try {
          const response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.message || 'Login failed.');

          setMessage('Login successful! Redirecting...', 'success');
          window.location.href = '/';
        } catch (error) {
          setMessage(error.message, 'error');
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
