<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Activity</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f3f6fb;
        font-family: Arial, sans-serif;
        color: #1f2937;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        background: #fff;
        padding: 18px 20px;
        border-radius: 14px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
        margin-bottom: 20px;
      }
      nav a {
        text-decoration: none;
        color: #1d4ed8;
        background: #eff6ff;
        padding: 10px 16px;
        border-radius: 10px;
        font-weight: 700;
      }
      nav a[aria-current="page"] { background: #dbeafe; }
      nav button, button {
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }
      button:disabled { opacity: 0.55; cursor: not-allowed; }
      input, select { font: inherit; }
      input, select {
        width: 100%;
        min-height: 42px;
        padding: 9px 11px;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        background: #fff;
      }
      h1 { margin-top: 0; }
      .panel {
        background: #fff;
        padding: 22px;
        border-radius: 14px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
        margin-bottom: 20px;
      }
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 16px;
        margin-bottom: 20px;
      }
      .summary-card {
        background: #fff;
        padding: 20px;
        border-radius: 14px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
      }
      .summary-card .label {
        color: #64748b;
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .summary-card .value {
        margin-top: 10px;
        font-size: 2rem;
        font-weight: 800;
        color: #0f172a;
      }
      .filters {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        align-items: end;
        gap: 12px;
      }
      .filters label {
        display: grid;
        gap: 7px;
        font-weight: 700;
      }
      .filter-actions { display: flex; gap: 8px; }
      .timezone-note { color: #475569; margin: 0 0 14px; }
      .table-scroll {
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        scrollbar-width: thin;
      }
      table { width: 100%; border-collapse: collapse; text-align: left; }
      th, td {
        padding: 12px 10px;
        border-bottom: 1px solid #e2e8f0;
        vertical-align: top;
      }
      th { background: #f8fafc; color: #334155; white-space: nowrap; }
      .status {
        display: inline-block;
        padding: 4px 9px;
        border-radius: 999px;
        background: #e2e8f0;
        white-space: nowrap;
      }
      .status.active { background: #dcfce7; color: #166534; }
      .status.failed, .status.expired { background: #fee2e2; color: #991b1b; }
      .status.logged_out { background: #e0e7ff; color: #3730a3; }
      details summary { color: #1d4ed8; cursor: pointer; font-weight: 700; }
      details dl { min-width: 240px; margin: 10px 0 0; }
      details dt { margin-top: 8px; color: #64748b; font-size: 0.85rem; }
      details dd { margin: 2px 0 0; overflow-wrap: anywhere; }
      #message { min-height: 24px; margin-bottom: 8px; font-weight: 700; }
      #message.error { color: #b91c1c; }
      #message.success { color: #15803d; }
      .pagination {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      @media (max-width: 640px) {
        .container { padding: 16px; }
        .panel { padding: 16px; }
        .filter-actions { grid-column: 1 / -1; }
      }
    </style>
    <link rel="stylesheet" href="/responsive.css" />
  </head>
  <body>
    <div class="container">
      <nav>
        <a href="/">Dashboard</a>
        <a href="/showResidents.html">Residents</a>
        <a href="/documentRequests.html">Document Requests</a>
        <a href="/officials.html">Officials</a>
        <a href="/announcements.html">Announcements</a>
        <a href="/activityLogs.html" aria-current="page">Login Activity</a>
        <button type="button" id="logout-button">Log out</button>
      </nav>

      <h1>Login Activity</h1>
      <section class="summary-grid" aria-label="Activity summary">
        <div class="summary-card">
          <div class="label">Successful logins</div>
          <div class="value" id="successful-logins">--</div>
        </div>
        <div class="summary-card">
          <div class="label">Failed login attempts</div>
          <div class="value" id="failed-logins">--</div>
        </div>
        <div class="summary-card">
          <div class="label">Active sessions</div>
          <div class="value" id="active-sessions">--</div>
        </div>
        <div class="summary-card">
          <div class="label">Logouts in date range</div>
          <div class="value" id="logouts">--</div>
        </div>
      </section>

      <section class="panel">
        <form id="filters" class="filters">
          <label>
            Search account or user ID
            <input id="search" type="search" maxlength="200" />
          </label>
          <label>
            Event type
            <select id="event-type">
              <option value="">All events</option>
              <option value="success">Successful login</option>
              <option value="failed">Failed login</option>
              <option value="logout">Logged out</option>
            </select>
          </label>
          <label>
            Session status
            <select id="status">
              <option value="">All statuses</option>
              <option value="active">Active</option>
              <option value="logged_out">Logged out</option>
              <option value="expired">Expired</option>
              <option value="failed">Failed login</option>
            </select>
          </label>
          <label>
            From date
            <input id="date-from" type="date" />
          </label>
          <label>
            To date
            <input id="date-to" type="date" />
          </label>
          <label>
            Sort by
            <select id="sort">
              <option value="login_at">Login time (newest)</option>
              <option value="last_activity_at">Last activity (newest)</option>
            </select>
          </label>
          <div class="filter-actions">
            <button type="submit">Apply filters</button>
            <button type="button" id="refresh-button">Refresh</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <p class="timezone-note" id="timezone-note"></p>
        <div id="message" role="status" aria-live="polite"></div>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Scrollable login activity table">
          <table>
            <thead>
              <tr>
                <th>Admin / User</th>
                <th>Event</th>
                <th>Login time</th>
                <th>Logout time</th>
                <th>Session status</th>
                <th>IP address</th>
                <th>Details</th>
              </tr>
            </thead>
            <tbody id="activity-body"></tbody>
          </table>
        </div>
        <div class="pagination">
          <button type="button" id="prev-page">Previous</button>
          <span id="page-indicator">Page 1</span>
          <button type="button" id="next-page">Next</button>
        </div>
      </section>
    </div>

    <script src="/auth.js" defer></script>
    <script src="/activityLogs.js" defer></script>
  </body>
</html>
